<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechConnect - Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <form id="formCadastro">
        <p>TechConnect</p>
        
        <label for="nome">Nome:
            <input type="text" id="nome" name="nome" autocomplete="name" required>
            <span id="nome-error" class="msg-erro"></span>
        </label>
        
        <label for="email">E-mail:
            <input type="email" id="email" name="email" autocomplete="email" required>
            <span id="email-error" class="msg-erro"></span>
        </label>
        
        <label for="password">Senha:
            <input type="password" id="password" name="password" required>
            <div class="progress-container">
                <div id="password-strength" class="progress-bar"></div>
            </div>
            <span id="password-error" class="msg-erro"></span>
        </label>
        <label for="confirm-password">Confirmar Senha:
            <input type="password" id="confirm-password" name="confirm-password" required>
            <span id="confirm-password-error" class="msg-erro"></span>
        </label>
        <div class="button-group">
            <button type="submit" id="login">
                <span id="btn-text">Login</span>
                <div id="spinner" class="spinner"></div>
            </button>
        </div>
        <div id="success-msg" class="success-banner"></div>
    </form>
    
    <script src="validation.js"></script>
</body>
</html>
